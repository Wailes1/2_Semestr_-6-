{% extends 'schedule/base.html' %}

{% block content %}
<h1>{% if student %}Редактирование{% else %}Добавление{% endif %} студента</h1>

<form method="post">
    {% csrf_token %}
    
    <div class="form-group">
        <label>Имя:</label>
        <input type="text" name="first_name" value="{{ student.first_name|default:'' }}" required>
    </div>
    
    <div class="form-group">
        <label>Фамилия:</label>
        <input type="text" name="last_name" value="{{ student.last_name|default:'' }}" required>
    </div>
    
    <div class="form-group">
        <label>Email:</label>
        <input type="email" name="email" value="{{ student.email|default:'' }}" required>
    </div>
    
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="/schedule/students/" class="btn">Отмена</a>
</form>
{% endblock %}

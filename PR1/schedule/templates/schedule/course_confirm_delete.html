{% extends 'schedule/base.html' %}

{% block content %}
<h1>Удаление курса</h1>

<div style="background: #fed7d7; padding: 20px; border-radius: 10px;">
    <p style="font-size: 1.2em;">Вы уверены, что хотите удалить курс?</p>
    <p><strong>{{ course.title }}</strong></p>
    <p>Цена: {{ course.price }} руб.</p>
    <p>Студентов: {{ course.students.count }}</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="/schedule/courses/{{ course.id }}/" class="btn">Отмена</a>
</form>
{% endblock %}
